<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Lab · voyage dans le cerveau (Persua)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
:root{
  --bg:#13133A; --deep:#07071A; --ink:#F1EFFA; --muted:#9B96B8;
  --indigo:#544AFA; --violet:#8b83ff; --electric:#4747FD;
  --disp:"Archivo Black",sans-serif; --ui:"Archivo",sans-serif; --mono:"Space Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ui);color:var(--ink);background:var(--bg);overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--indigo);color:#fff}

#stage{position:fixed;inset:0;z-index:0;background:var(--bg)}
#glowbg{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(60% 55% at 50% 14%,rgba(84,74,250,.28),transparent 60%),radial-gradient(50% 50% at 82% 78%,rgba(139,131,255,.14),transparent 60%);will-change:opacity}
#stars{position:fixed;inset:0;z-index:2;pointer-events:none}
#topo{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5}
#topo path{fill:none;stroke:#8b83ff;stroke-width:1;opacity:.08}

#portrait{position:fixed;left:50%;bottom:0;height:94vh;z-index:3;
  transform:translateX(-50%);transform-origin:60% 100%;will-change:transform,opacity;pointer-events:auto}
#portrait img{height:100%;display:block;filter:none;transition:filter .45s ease}
#portrait.scan img{filter:grayscale(1) contrast(1.08)}
#portrait::after{content:"";position:absolute;left:0;right:0;top:var(--scanpos,-20%);height:2px;
  background:linear-gradient(90deg,transparent,var(--violet),transparent);opacity:0;box-shadow:0 0 22px var(--violet);transition:opacity .3s}
#portrait.scan::after{opacity:1}

#brain{position:fixed;inset:0;z-index:4;pointer-events:none;will-change:transform}

.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:30px 34px;will-change:opacity,transform}
.brand{font-family:var(--disp);font-size:26px;line-height:.92;letter-spacing:-.03em;text-transform:uppercase;color:var(--ink)}
.brand small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.24em;color:var(--muted);margin-top:9px}
.tnav{display:flex;gap:12px;align-items:center}
.pill{background:var(--indigo);color:#fff;font-weight:700;font-size:13px;padding:12px 20px;border-radius:100px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 12px 30px -10px rgba(84,74,250,.7)}
.sq{width:44px;height:44px;border:1px solid rgba(255,255,255,.22);border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}
.sq i{width:16px;height:1.5px;background:var(--ink);display:block}

.lab{position:fixed;z-index:10;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;will-change:opacity}
.lab.head{left:calc(50% + 40px);top:22vh}
.lab.head::before{content:"";position:absolute;left:-52px;top:7px;width:44px;height:1px;background:var(--muted)}
.card{position:fixed;left:34px;bottom:34px;z-index:10;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px 18px;background:rgba(19,19,58,.5);backdrop-filter:blur(6px);will-change:opacity}
.card .t{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--muted);margin-bottom:9px}
.card .c{font-family:var(--disp);font-size:22px;letter-spacing:.14em;color:var(--ink)}
.scrollhint{position:fixed;right:34px;bottom:34px;z-index:10;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:10px;will-change:opacity}
.scrollhint i{width:1px;height:34px;background:var(--muted);display:inline-block;animation:pulse 1.8s ease-in-out infinite;transform-origin:top}
@keyframes pulse{0%,100%{transform:scaleY(.3);opacity:.4}50%{transform:scaleY(1);opacity:1}}

.zone{position:fixed;left:34px;top:50%;transform:translateY(-50%);z-index:12;max-width:440px;pointer-events:none;opacity:0;will-change:opacity}
.zone .zk{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--violet);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.zone .zdot{width:8px;height:8px;border-radius:50%;background:var(--violet);box-shadow:0 0 14px var(--violet)}
.zone .zbig{font-family:var(--disp);font-size:clamp(40px,7vw,104px);line-height:.9;letter-spacing:-.03em;color:#fff}
.zone h2{font-family:var(--ui);font-weight:600;font-size:clamp(22px,3vw,34px);color:#fff;margin-top:14px;letter-spacing:-.02em}
.zone p{font-family:var(--ui);font-size:17px;color:#C6C2DC;max-width:40ch;margin-top:16px}
.zbars{display:flex;gap:6px;margin-top:26px}
.zbars i{width:34px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);transition:background .3s}
.zbars i.on{background:var(--indigo)}
.zcta{pointer-events:auto;margin-top:30px;display:inline-flex;align-items:center;gap:10px;background:var(--indigo);color:#fff;font-weight:700;font-size:16px;padding:15px 28px;border-radius:100px;opacity:0;transition:opacity .4s;box-shadow:0 16px 40px -14px rgba(84,74,250,.7)}

#track{position:relative;z-index:5;height:600vh;pointer-events:none}

@media (max-width:700px){ #portrait{height:64vh} .brand{font-size:20px} .lab.head{display:none} .zone{max-width:82vw} }
@media (prefers-reduced-motion:reduce){ .scrollhint i{animation:none} }
</style>
</head>
<body>
<div id="stage"></div>
<div id="dbg" style="position:fixed;top:72px;left:10px;z-index:9999;font:11px/1.4 monospace;color:#0f0;background:rgba(0,0,0,.7);padding:8px 10px;white-space:pre;pointer-events:none;display:none;border-radius:6px"></div>
<div id="glowbg"></div>
<canvas id="stars"></canvas>
<svg id="topo" preserveAspectRatio="none" viewBox="0 0 1440 900">
  <path d="M-50 180 C 300 120 500 260 760 210 S 1200 120 1500 220"/>
  <path d="M-50 300 C 320 250 520 380 780 330 S 1220 250 1500 350"/>
  <path d="M-50 470 C 300 410 560 560 820 500 S 1240 420 1500 520"/>
  <path d="M-50 640 C 340 590 540 720 800 660 S 1220 590 1500 690"/>
  <path d="M-50 800 C 300 760 560 880 820 820 S 1240 760 1500 860"/>
</svg>

<canvas id="brain"></canvas>

<div id="portrait">
  <img src="assets/brand/steven_cutout.webp" alt="Steven Lefrançois">
</div>

<div class="top" id="topbar">
  <div class="brand">Steven<br>Lefrançois<small>Neurovente — Persua™</small></div>
  <div class="tnav">
    <a class="pill" href="https://diagnostic.persua-neurovente.com/" target="_blank" rel="noopener">◆ Diagnostic</a>
    <div class="sq"><i></i><i></i><i></i></div>
  </div>
</div>
<div class="lab head" id="labHead">Cortex préfrontal<br>zone de décision</div>
<div class="card" id="card"><div class="t">Méthode</div><div class="c">C · A · L · M · E</div></div>
<div class="scrollhint" id="hint"><span>Scroll pour entrer</span><i></i></div>

<div class="zone" id="zone">
  <div class="zk"><span class="zdot"></span><span id="zkTxt">Zone 1 / 5 — activée</span></div>
  <div class="zbig" id="zBig">C</div>
  <h2 id="zTitle">Cadre</h2>
  <p id="zText">L'état du vendeur, réglé avant le rendez-vous. Ton calme se transmet au cerveau d'en face.</p>
  <div class="zbars" id="zBars"><i></i><i></i><i></i><i></i><i></i></div>
  <a class="zcta" id="zCta" href="https://diagnostic.persua-neurovente.com/" target="_blank" rel="noopener">Faire le diagnostic gratuit →</a>
</div>

<div id="track"></div>

<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lenis=null;
  if(!reduce && window.Lenis){ lenis=new Lenis({lerp:0.08,smoothWheel:true}); (function raf(t){ lenis.raf(t); requestAnimationFrame(raf); })(); }

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function smooth(a,b,x){ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); }
  function mix(a,b,t){return a+(b-a)*t;}

  /* placement de la tête (réglable) */
  var HEAD_FX=0.45, HEAD_FY=0.13, HEAD_DIA=0.22, CAMZ=3.2, FOV=40; // position/taille du cerveau RELATIVE à la photo

  /* zones = étapes CALME, couleurs Persua (indigo/violet) */
  var ZONES=[
    {L:'C',t:'Cadre',    d:"L'état du vendeur, réglé avant le rendez-vous. Ton calme se transmet au cerveau d'en face.", az:-0.95, ey:0.55, col:[0.55,0.51,1.0]},
    {L:'A',t:'Apaiser',  d:"Fais tomber la menace perçue. Un cerveau en sécurité écoute ; sur la défensive, il surveille.", az:-0.45, ey:-0.10, col:[0.33,0.29,0.98]},
    {L:'L',t:'Localiser',d:"Le client mesure lui-même ce que son problème lui coûte. Ses chiffres pèsent plus que les tiens.", az:0.0,  ey:-0.45, col:[0.66,0.62,1.0]},
    {L:'M',t:'Miroir',   d:"Sa valeur, dans ses mots. Quand il entend son propre vocabulaire, il ressent « c'est exactement ça ».", az:0.5, ey:0.18, col:[0.45,0.40,1.0]},
    {L:'E',t:'Engager',  d:"Une décision déjà mûre. Conclure, pas pousser : la pression amplifie l'alarme, la stabilité la dissout.", az:0.95, ey:0.5, col:[0.60,0.55,1.0]}
  ];

  var canvas=document.getElementById('brain'), renderer, scene, camera, group, mat, glow, R=1, hovered=false;
  var vTmp=null;
  if(window.THREE){ try{ renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true,powerPreference:'high-performance'}); }catch(e){} }
  if(renderer){
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(FOV,1,.1,50); camera.position.set(0,0,CAMZ);
    group=new THREE.Group(); scene.add(group);
    vTmp=new THREE.Vector3();
    function softTex(){ var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d');
      var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.45,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c); }
    mat=new THREE.ShaderMaterial({
      uniforms:{uMorph:{value:0},uTime:{value:0},uScale:{value:0.2},uPos:{value:new THREE.Vector3()},uRotY:{value:0},uSize:{value:1.0},uColor:{value:new THREE.Color(0x8b83ff)},uAlpha:{value:0.72},uTex:{value:softTex()}},
      vertexShader:
        "uniform float uMorph,uTime,uScale,uRotY,uSize; uniform vec3 uPos;"+
        "attribute vec3 aSnow; attribute float aSeed;"+
        "void main(){"+
        "  float c=cos(uRotY), s=sin(uRotY);"+
        "  vec3 b=position;"+
        "  vec3 br=vec3(b.x*c+b.z*s, b.y, -b.x*s+b.z*c);"+       // rotation Y du cerveau
        "  vec3 brainW=br*uScale+uPos;"+                          // cerveau assemblé, dans la tête
        "  vec3 sn=aSnow;"+
        "  sn.y=mod(aSnow.y - uTime*0.35 + 4.0, 8.0) - 4.0;"+     // chute (tempête de neige)
        "  sn.x+=sin(uTime*0.6 + aSeed*6.2831)*0.18;"+            // balancement
        "  vec3 fin=mix(sn, brainW, uMorph);"+                    // neige (0) -> cerveau (1)
        "  vec4 mv=modelViewMatrix*vec4(fin,1.0);"+
        "  gl_Position=projectionMatrix*mv;"+
        "  gl_PointSize=max(uSize*(9.0/ -mv.z), 1.0);"+
        "}",
      fragmentShader:
        "uniform vec3 uColor; uniform float uAlpha; uniform sampler2D uTex;"+
        "void main(){ float a=texture2D(uTex, gl_PointCoord).a; gl_FragColor=vec4(uColor,1.0)*a*uAlpha; }",
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
    });
    glow=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex(),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,color:0x8b83ff}));
    glow.scale.setScalar(0.9); group.add(glow);
    fetch('assets/models/brain-points.bin').then(function(r){return r.arrayBuffer();}).then(function(ab){
      var q=new Int16Array(ab), n=q.length/3, p=new Float32Array(n*3), snow=new Float32Array(n*3), seed=new Float32Array(n);
      for(var i=0;i<n;i++){
        p[i*3]=q[i*3]/32767; p[i*3+1]=q[i*3+1]/32767; p[i*3+2]=q[i*3+2]/32767*-1;
        snow[i*3]=(Math.random()*2-1)*2.6; snow[i*3+1]=(Math.random()*2-1)*1.7; snow[i*3+2]=(Math.random()*2-1)*0.8; seed[i]=Math.random();
      }
      var geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(p,3));
      geo.setAttribute('aSnow',new THREE.BufferAttribute(snow,3));
      geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
      geo.center(); geo.computeBoundingSphere(); R=(geo.boundingSphere&&geo.boundingSphere.radius)||1;
      group.add(new THREE.Points(geo,mat));
    }).catch(function(){});
    function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
    addEventListener('resize',resize); resize();
  }

  var portrait=document.getElementById('portrait');
  portrait.addEventListener('mouseenter',function(){ hovered=true; portrait.classList.add('scan'); });
  portrait.addEventListener('mouseleave',function(){ hovered=false; portrait.classList.remove('scan'); });

  var stage=document.getElementById('stage'), glowbg=document.getElementById('glowbg'), track=document.getElementById('track'),
      topbar=document.getElementById('topbar'), labHead=document.getElementById('labHead'),
      card=document.getElementById('card'), hint=document.getElementById('hint'), topo=document.getElementById('topo'),
      zone=document.getElementById('zone'), zkTxt=document.getElementById('zkTxt'), zBig=document.getElementById('zBig'),
      zTitle=document.getElementById('zTitle'), zText=document.getElementById('zText'), zCta=document.getElementById('zCta'),
      zBars=document.getElementById('zBars').children;
  var P=0, brainReveal=0, revealed=0, scanTarget=0, curZone=-1;
  var forceReveal=location.search.indexOf('reveal')>=0; // debug : force l'affichage du cerveau
  var DBG=location.search.indexOf('debug')>=0, dbg=document.getElementById('dbg'); if(DBG&&dbg) dbg.style.display='block';
  var _pm=location.search.match(/[?&]p=([0-9.]+)/); var FORCEP=_pm?parseFloat(_pm[1]):null; // debug : force la position de scroll

  /* ----- tempête de neige (starfield) derrière la photo ----- */
  var starCv=document.getElementById('stars'), sctx=starCv?starCv.getContext('2d'):null, STARS=[];
  function initStars(){ STARS=[]; var N=Math.min(360,Math.round(innerWidth*innerHeight/8000));
    for(var i=0;i<N;i++){ STARS.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+0.35,a:Math.random()*0.6+0.25,tw:Math.random()*2.6+0.5,vx:(Math.random()-0.5)*0.00006,vy:Math.random()*0.0001+0.00003}); } }
  function sizeStars(){ if(!starCv||!sctx)return; var dpr=Math.min(devicePixelRatio,2); starCv.width=innerWidth*dpr; starCv.height=innerHeight*dpr; sctx.setTransform(dpr,0,0,dpr,0,0); }
  function drawStars(tm,fade){ if(!sctx)return; sctx.clearRect(0,0,innerWidth,innerHeight); if(fade<=0)return;
    for(var i=0;i<STARS.length;i++){ var s=STARS[i]; s.x+=s.vx; s.y+=s.vy; if(s.y>1)s.y-=1; if(s.x>1)s.x-=1; if(s.x<0)s.x+=1;
      var tw=0.55+0.45*Math.sin(tm*s.tw + i); sctx.beginPath();
      sctx.fillStyle='rgba('+Math.round(180+40*tw)+','+Math.round(195+35*tw)+',255,'+(s.a*tw*fade)+')';
      sctx.arc(s.x*innerWidth, s.y*innerHeight, s.r, 0, 6.2832); sctx.fill(); } }
  initStars(); sizeStars(); addEventListener('resize',function(){ sizeStars(); initStars(); });

  function setZone(i){
    i=clamp(i,0,ZONES.length-1);
    if(i===curZone) return; curZone=i; var z=ZONES[i];
    zkTxt.textContent='Zone '+(i+1)+' / 5 — activée'; zBig.textContent=z.L; zTitle.textContent=z.t; zText.textContent=z.d;
    for(var k=0;k<zBars.length;k++) zBars[k].classList.toggle('on',k<=i);
  }

  function frame(){
    var vh=innerHeight, r=track.getBoundingClientRect();
    P = clamp((-r.top)/(track.offsetHeight - vh), 0, 1);
    if(FORCEP!==null) P=FORCEP;

    var e = smooth(0.05,0.30,P);
    var innerP = smooth(0.30,1.0,P);
    var dark = smooth(0.05,0.30,P);

    // fond : navy -> quasi noir + glow qui s'éteint en entrant
    stage.style.background = 'rgb('+Math.round(mix(19,7,dark))+','+Math.round(mix(19,7,dark))+','+Math.round(mix(58,26,dark))+')';
    glowbg.style.opacity = (1-dark)+''; topo.style.opacity=(0.5*(1-dark))+'';
    drawStars(Date.now()*0.001, 1-dark);

    // portrait
    var px=-e*46, sc=1+e*0.16, op=1-smooth(0.05,0.28,P);
    portrait.style.transform='translateX(calc(-50% + '+px+'vw)) scale('+sc+') rotate('+(e*-3)+'deg)';
    portrait.style.opacity=op;

    // scan + révélation dans la tête (au survol, à l'accueil)
    if(hovered && P<0.05){
      var s=((Date.now()%2200)/2200), sp=6+s*80;
      portrait.style.setProperty('--scanpos', sp+'%');
      var passed=smooth(8,30,sp); if(passed>0.85) revealed=1; scanTarget=Math.max(passed,revealed);
    } else if(P<0.05){ revealed=0; scanTarget=0; portrait.style.setProperty('--scanpos','-20%'); }
    brainReveal += (scanTarget-brainReveal)*0.15;

    var outFade=1-smooth(0.04,0.22,P);
    topbar.style.opacity=Math.max(outFade,0); topbar.style.transform='translateY('+(-e*24)+'px)';
    labHead.style.opacity=outFade; card.style.opacity=outFade; hint.style.opacity=1-smooth(0.02,0.12,P);

    zone.style.opacity=smooth(0.34,0.42,P);
    zCta.style.opacity = innerP>0.8 ? 1 : 0;

    if(renderer){
      var Hw=2*Math.tan(FOV*Math.PI/180/2)*CAMZ, wpp=Hw/innerHeight;
      var rect=portrait.getBoundingClientRect();                       // on suit la VRAIE position de la photo
      var hpx=rect.left+HEAD_FX*rect.width, hpy=rect.top+HEAD_FY*rect.height;
      vTmp.set((hpx/innerWidth)*2-1, -((hpy/innerHeight)*2-1), 0.5).unproject(camera);
      vTmp.sub(camera.position).normalize();
      var dist=-camera.position.z/vTmp.z;
      var hx=camera.position.x+vTmp.x*dist, hy=camera.position.y+vTmp.y*dist;
      var headScale=(HEAD_DIA*rect.height*wpp)/(2*R), fillScale=(0.72*Hw)/(2*R);
      var sc=mix(headScale,fillScale,e), pxw=mix(hx,0,e), pyw=mix(hy,0,e);

      var zf=clamp(innerP*5,0,4.999), zi=Math.floor(zf), zj=Math.min(zi+1,4), fr=zf-zi;
      setZone(zi);
      var az=mix(ZONES[zi].az,ZONES[zj].az,fr), ey=mix(ZONES[zi].ey,ZONES[zj].ey,fr);
      var roty=mix(0.6,-az,e);
      var cr=mix(ZONES[zi].col[0],ZONES[zj].col[0],fr), cg=mix(ZONES[zi].col[1],ZONES[zj].col[1],fr), cb=mix(ZONES[zi].col[2],ZONES[zj].col[2],fr);

      // morph : neige (0) quand photo couleur -> cerveau assemblé (1) au scan/scroll
      var morph=clamp(Math.max(brainReveal, forceReveal?1:0, smooth(0.02,0.20,P)),0,1);
      if(mat){
        var u=mat.uniforms;
        u.uTime.value=Date.now()*0.001; u.uScale.value=sc; u.uPos.value.set(pxw,pyw,0);
        u.uRotY.value=roty; u.uMorph.value=morph; u.uColor.value.setRGB(cr,cg,cb);
        u.uAlpha.value=morph*0.92;   // cerveau invisible au repos, visible quand il se rassemble / au scroll
      }
      if(glow){
        glow.position.set(pxw, pyw+ey*R*sc, R*sc*0.9);   // marqueur zone, devant le cerveau
        glow.material.color.setRGB(cr,cg,cb);
        glow.scale.setScalar(0.25+innerP*0.4);
        glow.material.opacity=smooth(0.34,0.5,P);
      }
      if(DBG&&dbg) dbg.textContent='iW '+innerWidth+'  iH '+innerHeight+'  dpr '+devicePixelRatio
        +'\nrect L'+Math.round(rect.left)+' T'+Math.round(rect.top)+' W'+Math.round(rect.width)+' H'+Math.round(rect.height)
        +'\nworld hx '+hx.toFixed(3)+' hy '+hy.toFixed(3)+'  sc '+sc.toFixed(3)
        +'\nmorph '+morph.toFixed(2)+'  e '+e.toFixed(3)+'  P '+P.toFixed(3);
      renderer.render(scene,camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
