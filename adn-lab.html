<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADN Lab · double hélice en particules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
:root{--bg:#13133A;--deep:#07071A;--ink:#F1EFFA;--muted:#9B96B8;--indigo:#544AFA;--violet:#8b83ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--deep);color:var(--ink);overflow-x:hidden;font-family:"Space Mono",monospace}
#stage{position:fixed;inset:0;z-index:0;background:radial-gradient(85% 75% at 50% 45%,#0e0e2a,#0a0a1e 55%,#05050f 100%)}
#aura{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#aura span{position:absolute;border-radius:50%;filter:blur(120px);opacity:.2;mix-blend-mode:screen;will-change:transform}
#aura .a1{width:640px;height:640px;background:#544AFA;top:-8%;right:-6%;animation:d1 20s ease-in-out infinite}
#aura .a2{width:560px;height:560px;background:#8b83ff;bottom:-12%;left:-8%;animation:d2 26s ease-in-out infinite}
#aura .a3{width:520px;height:520px;background:#4747FD;bottom:-14%;right:8%;opacity:.2;animation:d3 30s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,50px) scale(1.12)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-40px) scale(1.1)}}
@keyframes d3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-30px) scale(1.15)}}
#stars{position:fixed;inset:0;z-index:2;pointer-events:none}
#dna{position:fixed;inset:0;z-index:4;pointer-events:none}
.tag{position:fixed;left:34px;top:30px;z-index:10;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--violet);font-weight:400}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:10;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.hint i{width:1px;height:34px;background:var(--muted);animation:pl 1.8s ease-in-out infinite;transform-origin:top}
@keyframes pl{0%,100%{transform:scaleY(.3);opacity:.4}50%{transform:scaleY(1);opacity:1}}
#track{position:relative;z-index:5;height:320vh;pointer-events:none}
@media(prefers-reduced-motion:reduce){.hint i{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="aura"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<canvas id="stars"></canvas>
<canvas id="dna"></canvas>
<div class="tag">Persua · <b>l'ADN de la décision</b></div>
<div class="hint"><span>scroll</span><i></i></div>
<div id="track"></div>

<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lenis=null; if(!reduce&&window.Lenis){lenis=new Lenis({lerp:0.08,smoothWheel:true});(function raf(t){lenis.raf(t);requestAnimationFrame(raf);})();}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function smooth(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}
  function mix(a,b,t){return a+(b-a)*t;}

  /* starfield */
  var starCv=document.getElementById('stars'),sctx=starCv.getContext('2d'),STARS=[];
  function initStars(){STARS=[];var N=Math.min(340,Math.round(innerWidth*innerHeight/8500));for(var i=0;i<N;i++)STARS.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+0.3,a:Math.random()*0.6+0.25,tw:Math.random()*2.6+0.5,vx:(Math.random()-0.5)*0.00005,vy:Math.random()*0.00009+0.00002});}
  function sizeStars(){var d=Math.min(devicePixelRatio,2);starCv.width=innerWidth*d;starCv.height=innerHeight*d;sctx.setTransform(d,0,0,d,0,0);}
  function drawStars(tm){sctx.clearRect(0,0,innerWidth,innerHeight);for(var i=0;i<STARS.length;i++){var s=STARS[i];s.x+=s.vx;s.y+=s.vy;if(s.y>1)s.y-=1;if(s.x>1)s.x-=1;if(s.x<0)s.x+=1;var tw=0.55+0.45*Math.sin(tm*s.tw+i);sctx.beginPath();sctx.fillStyle='rgba('+Math.round(180+40*tw)+','+Math.round(195+35*tw)+',255,'+(s.a*tw)+')';sctx.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,6.2832);sctx.fill();}}
  initStars();sizeStars();addEventListener('resize',function(){sizeStars();initStars();});

  /* three.js : double hélice ADN */
  var canvas=document.getElementById('dna'),renderer,scene,camera,group,mat,CAMZ=6.2,FOV=40;
  if(window.THREE){try{renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true,powerPreference:'high-performance'});}catch(e){}}
  if(renderer){
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(FOV,1,.1,50);camera.position.set(0,0,CAMZ);
    group=new THREE.Group();scene.add(group);
    function softTex(){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d');var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.45,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
    // construction de l'hélice
    var POS=[],COL=[],SNOW=[],SEED=[];
    function pushPt(x,y,z,r,g,b){POS.push(x,y,z);COL.push(r,g,b);SNOW.push((Math.random()*2-1)*3.2,(Math.random()*2-1)*3.2,(Math.random()*2-1)*1.6);SEED.push(Math.random());}
    var R=1.0,H=3.8,turns=4.0,SN=2000;
    for(var s=0;s<2;s++){var ph=s*Math.PI;
      for(var i=0;i<SN;i++){var f=i/SN;var t=f*turns*Math.PI*2;var y=(f-0.5)*H;
        var x=Math.cos(t+ph)*R+(Math.random()*2-1)*0.018, z=Math.sin(t+ph)*R+(Math.random()*2-1)*0.018;
        pushPt(x,y,z, mix(0.66,0.42,f), mix(0.58,0.36,f), 1.0);}}
    var RUNGS=Math.round(turns*8);
    for(var rr=0;rr<RUNGS;rr++){var f=(rr+0.5)/RUNGS;var t=f*turns*Math.PI*2;var y=(f-0.5)*H;
      var x1=Math.cos(t)*R,z1=Math.sin(t)*R,x2=Math.cos(t+Math.PI)*R,z2=Math.sin(t+Math.PI)*R;
      var hot=(rr%5===2),rn=14;
      for(var k=0;k<rn;k++){var a=k/(rn-1);var x=x1+(x2-x1)*a,z=z1+(z2-z1)*a;
        if(hot){pushPt(x,y,z,1.0,0.36,0.44);}else{pushPt(x,y,z,0.52,0.58,1.0);}}}
    mat=new THREE.ShaderMaterial({
      uniforms:{uMorph:{value:0},uTime:{value:0},uSize:{value:4.0},uAlpha:{value:1.0},uTex:{value:softTex()}},
      vertexShader:"uniform float uMorph,uTime,uSize;attribute vec3 aSnow;attribute vec3 aColor;attribute float aSeed;varying vec3 vColor;void main(){vColor=aColor;vec3 sn=aSnow;sn.y=mod(aSnow.y-uTime*0.25+4.0,8.0)-4.0;sn.x+=sin(uTime*0.5+aSeed*6.2831)*0.2;vec3 fin=mix(sn,position,uMorph);vec4 mv=modelViewMatrix*vec4(fin,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=max(uSize*(9.0/-mv.z),1.0);}",
      fragmentShader:"uniform float uAlpha;uniform sampler2D uTex;varying vec3 vColor;void main(){float a=texture2D(uTex,gl_PointCoord).a;gl_FragColor=vec4(vColor,1.0)*a*uAlpha;}",
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
    });
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(POS),3));
    geo.setAttribute('aColor',new THREE.BufferAttribute(new Float32Array(COL),3));
    geo.setAttribute('aSnow',new THREE.BufferAttribute(new Float32Array(SNOW),3));
    geo.setAttribute('aSeed',new THREE.BufferAttribute(new Float32Array(SEED),1));
    group.add(new THREE.Points(geo,mat));
    function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
    addEventListener('resize',resize);resize();
  }

  var track=document.getElementById('track'),t0=null,FORCE=location.search.indexOf('assembled')>=0;
  function frame(ts){
    if(t0===null)t0=ts; var el=(ts-t0)/1000;
    var r=track.getBoundingClientRect(),vh=innerHeight;
    var P=clamp((-r.top)/(track.offsetHeight-vh),0,1);
    drawStars(el);
    if(renderer){
      var morph=smooth(0.3,3.0,el);                 // assemblage à l'arrivée
      group.rotation.y = el*0.16 + P*Math.PI*3.2;    // tourne + accélère au scroll
      group.rotation.x = 0.12 + Math.sin(el*0.25)*0.05;
      group.position.y = mix(0, 0, P);
      camera.position.z = mix(CAMZ, 3.6, smooth(0,1,P)); // on plonge un peu dans l'hélice
      if(mat){var u=mat.uniforms;u.uTime.value=el;u.uMorph.value=FORCE?1:morph;u.uSize.value=4.0+P*1.2;}
      renderer.render(scene,camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
