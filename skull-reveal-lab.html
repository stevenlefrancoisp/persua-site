<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reveal Lab · humain → zoom → crâne</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{background:#07071A;color:#F1EFFA;font-family:"Space Mono",monospace}
#stage{position:fixed;inset:0;z-index:0;background:radial-gradient(80% 70% at 50% 25%,#191946,#0f0f2e 55%,#07071A 100%)}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
/* wrapper qui zoome, origine = la tête */
#portrait{position:fixed;left:50%;bottom:0;height:94vh;z-index:3;transform:translateX(-50%);transform-origin:48% 13%;will-change:transform,opacity}
#portrait .lay{position:absolute;bottom:0;left:50%;height:100%;transform:translateX(-50%);will-change:opacity,transform}
#portrait .human{z-index:2}
#portrait .skull{z-index:4;opacity:0;will-change:opacity}
#portrait img{height:100%;display:block}
.tag{position:fixed;left:30px;top:26px;z-index:10;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#9B96B8}
.tag b{color:#8b83ff;font-weight:400}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:10;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9B96B8;display:flex;flex-direction:column;align-items:center;gap:9px}
.hint i{width:1px;height:32px;background:#9B96B8;animation:pl 1.8s ease-in-out infinite;transform-origin:top}
@keyframes pl{0%,100%{transform:scaleY(.3);opacity:.4}50%{transform:scaleY(1);opacity:1}}
#track{position:relative;z-index:5;height:260vh;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="stars"></canvas>
<div id="portrait">
  <div class="lay human"><img src="assets/brand/steven_cutout.webp" alt="Steven"></div>
  <div class="lay skull"><img src="assets/brand/steven_skull_aligned.webp" alt=""></div>
</div>
<div class="tag">Persua · <b>on entre dans ta tête</b></div>
<div class="hint"><span>scroll</span><i></i></div>
<div id="track"></div>

<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lenis=null;if(!reduce&&window.Lenis){lenis=new Lenis({lerp:0.08,smoothWheel:true});(function raf(t){lenis.raf(t);requestAnimationFrame(raf);})();}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function smooth(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}

  var starCv=document.getElementById('stars'),sctx=starCv.getContext('2d'),STARS=[];
  function initStars(){STARS=[];var N=Math.min(240,Math.round(innerWidth*innerHeight/10000));for(var i=0;i<N;i++)STARS.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.3,a:Math.random()*0.5+0.2,tw:Math.random()*2.6+0.5});}
  function sizeStars(){var d=Math.min(devicePixelRatio,2);starCv.width=innerWidth*d;starCv.height=innerHeight*d;sctx.setTransform(d,0,0,d,0,0);}
  function drawStars(tm){sctx.clearRect(0,0,innerWidth,innerHeight);for(var i=0;i<STARS.length;i++){var s=STARS[i];var tw=0.5+0.5*Math.sin(tm*s.tw+i);sctx.beginPath();sctx.fillStyle='rgba(180,195,255,'+(s.a*tw*.6)+')';sctx.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,6.2832);sctx.fill();}}
  initStars();sizeStars();addEventListener('resize',function(){sizeStars();initStars();});

  var portrait=document.getElementById('portrait'),skull=portrait.querySelector('.skull'),track=document.getElementById('track'),t0=null;
  (function(){var m=location.search.match(/sky=(-?[0-9.]+)/);if(m)portrait.style.setProperty('--sky',m[1]+'%');var n=location.search.match(/sks=([0-9.]+)/);if(n)portrait.style.setProperty('--sks',n[1]);})();
  var _fp=location.search.match(/[?&]p=([0-9.]+)/),FORCEP=_fp?parseFloat(_fp[1]):null;
  function frame(ts){
    if(t0===null)t0=ts;var el=(ts-t0)/1000;
    var r=track.getBoundingClientRect(),vh=innerHeight;
    var P=clamp((-r.top)/(track.offsetHeight-vh),0,1);if(FORCEP!==null)P=FORCEP;
    drawStars(el);
    // zoom dans la tête
    var zoom=1+P*4.2;
    portrait.style.transform='translateX(-50%) scale('+zoom+')';
    portrait.style.opacity=(1-smooth(0.82,0.98,P));           // on finit par traverser dans le cerveau
    // FONDU / transparence : ton crâne+cerveau apparaît EN TRANSPARENCE sur ton visage (même taille, aligné)
    skull.style.opacity=(smooth(0.10,0.55,P)*0.8)+'';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
