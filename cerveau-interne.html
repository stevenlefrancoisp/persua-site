<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerveau interne · immersion neurones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
:root{--deep:#05050f;--muted:#9B96B8;--violet:#8b83ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--deep);color:#F1EFFA;overflow-x:hidden;font-family:"Space Mono",monospace}
#stage{position:fixed;inset:0;z-index:0;background:radial-gradient(90% 80% at 50% 50%,#0b0b22,#070714 55%,#04040c 100%)}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
#brain{position:fixed;inset:0;z-index:2}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(60% 55% at 50% 50%,transparent 55%,rgba(4,4,12,.85) 100%)}
.tag{position:fixed;left:34px;top:30px;z-index:10;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--violet);font-weight:400}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:10;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.hint i{width:1px;height:34px;background:var(--muted);animation:pl 1.8s ease-in-out infinite;transform-origin:top}
@keyframes pl{0%,100%{transform:scaleY(.3);opacity:.4}50%{transform:scaleY(1);opacity:1}}
#track{position:relative;z-index:5;height:340vh;pointer-events:none}
@media(prefers-reduced-motion:reduce){.hint i{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="stars"></canvas>
<canvas id="brain"></canvas>
<div id="vig"></div>
<div class="tag">Persua · <b>à l'intérieur du cerveau acheteur</b></div>
<div class="hint"><span>traverse</span><i></i></div>
<div id="track"></div>

<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lenis=null; if(!reduce&&window.Lenis){lenis=new Lenis({lerp:0.08,smoothWheel:true});(function raf(t){lenis.raf(t);requestAnimationFrame(raf);})();}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function smooth(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}
  function mix(a,b,t){return a+(b-a)*t;}

  var starCv=document.getElementById('stars'),sctx=starCv.getContext('2d'),STARS=[];
  function initStars(){STARS=[];var N=Math.min(260,Math.round(innerWidth*innerHeight/11000));for(var i=0;i<N;i++)STARS.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.3,a:Math.random()*0.5+0.2,tw:Math.random()*2.6+0.5});}
  function sizeStars(){var d=Math.min(devicePixelRatio,2);starCv.width=innerWidth*d;starCv.height=innerHeight*d;sctx.setTransform(d,0,0,d,0,0);}
  function drawStars(tm){sctx.clearRect(0,0,innerWidth,innerHeight);for(var i=0;i<STARS.length;i++){var s=STARS[i];var tw=0.5+0.5*Math.sin(tm*s.tw+i);sctx.beginPath();sctx.fillStyle='rgba(170,185,255,'+(s.a*tw*.5)+')';sctx.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,6.2832);sctx.fill();}}
  initStars();sizeStars();addEventListener('resize',function(){sizeStars();initStars();});

  var canvas=document.getElementById('brain'),renderer,scene,camera,group,mat,FOV=62;
  if(window.THREE){try{renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true,powerPreference:'high-performance'});}catch(e){}}
  if(renderer){
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(FOV,1,.01,50);camera.position.set(0,0,3.4);
    group=new THREE.Group();scene.add(group);
    function softTex(){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d');var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.4,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
    mat=new THREE.ShaderMaterial({
      uniforms:{uTime:{value:0},uSize:{value:2.6},uAlpha:{value:1.0},uTex:{value:softTex()}},
      vertexShader:"uniform float uTime,uSize;attribute vec3 aColor;attribute float aSeed;varying vec3 vColor;varying float vFade;void main(){vColor=aColor;vec4 mv=modelViewMatrix*vec4(position,1.0);float mvz=-mv.z;vFade=smoothstep(0.25,1.4,mvz)*(1.0-smoothstep(5.5,9.5,mvz));float tw=0.75+0.25*sin(uTime*1.6+aSeed*30.0);gl_Position=projectionMatrix*mv;gl_PointSize=max(uSize*tw*(9.0/mvz),1.0);}",
      fragmentShader:"uniform float uAlpha;uniform sampler2D uTex;varying vec3 vColor;varying float vFade;void main(){float a=texture2D(uTex,gl_PointCoord).a;gl_FragColor=vec4(vColor,1.0)*a*uAlpha*vFade;}",
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
    });
    fetch('assets/models/brain-points.bin').then(function(r){return r.arrayBuffer();}).then(function(ab){
      var q=new Int16Array(ab),n=q.length/3,p=new Float32Array(n*3),col=new Float32Array(n*3),seed=new Float32Array(n);
      for(var i=0;i<n;i++){
        p[i*3]=q[i*3]/32767;p[i*3+1]=q[i*3+1]/32767;p[i*3+2]=q[i*3+2]/32767*-1;
        var br=Math.random(),spark=br>0.93;
        if(spark){col[i*3]=0.82;col[i*3+1]=0.86;col[i*3+2]=1.0;}
        else{var m=0.35+0.55*br;col[i*3]=0.42*m+0.12;col[i*3+1]=0.40*m+0.10;col[i*3+2]=1.0*m;}
        seed[i]=Math.random();
      }
      var geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(p,3));
      geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
      geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
      geo.center();geo.computeBoundingSphere();
      group.add(new THREE.Points(geo,mat));
      group.scale.setScalar(3.4);
    }).catch(function(){});
    function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
    addEventListener('resize',resize);resize();
  }

  var track=document.getElementById('track'),t0=null,FORCEP=(function(){var m=location.search.match(/[?&]p=([0-9.]+)/);return m?parseFloat(m[1]):null;})();
  function frame(ts){
    if(t0===null)t0=ts;var el=(ts-t0)/1000;
    var r=track.getBoundingClientRect(),vh=innerHeight;
    var P=clamp((-r.top)/(track.offsetHeight-vh),0,1); if(FORCEP!==null)P=FORCEP;
    drawStars(el);
    if(renderer&&group){
      // on traverse le cerveau : la caméra avance à travers le nuage
      camera.position.z = mix(3.6, -3.6, P);
      camera.position.x = Math.sin(el*0.12)*0.25;   // dérive douce
      camera.position.y = Math.cos(el*0.10)*0.18;
      group.rotation.y = el*0.05 + P*0.6;           // rotation lente
      group.rotation.x = 0.06 + Math.sin(el*0.15)*0.04;
      if(mat){mat.uniforms.uTime.value=el;mat.uniforms.uSize.value=2.6+P*1.0;}
      renderer.render(scene,camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
